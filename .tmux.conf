unbind-key C-b
set-option -g prefix C-t 
bind-key C-t send-prefix

# 標準出力の履歴の行数を既定の2000から変更する
set-option -g history-limit 10000

# マウスでウィンドウ・ペインの切り替えやリサイズを可能にする
set-option -g mouse on

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1

# ステータスバーをトップに配置する
set-option -g status-position top

# 左右のステータスバーの長さを決定する
set-option -g status-left-length 90
set-option -g status-right-length 90

# #H => マシン名
# #P => ペイン番号
# 最左に表示
# 先頭に、対応待ちのエージェント数（✋承認・質問待ち、✅未確認の完了）を出す
set-option -g status-left '#{@claude_summary}#H:[#P]'

# Wi-Fi、バッテリー残量、現在時刻#
# 最右に表示
set-option -g status-right '#(wifi) #(battery) (#(battery --remain))[%Y-%m-%d(%a) %H:%M]'

# ステータスバーを1秒毎に描画し直す
set-option -g status-interval 1

# センタライズ（主にウィンドウ番号など）
set-option -g status-justify centre

# tmux 内でも 24bit カラー（truecolor）を有効にする
# 外側の Ghostty は terminfo に Tc を持つため、上書き指定で tmux へ引き継ぐ
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:RGB"

# ---- Claude Code のエージェント状態表示と切り替え（herdr の擬似再現） ----
# 状態は Claude Code の hook から ~/.tmux/bin/claude-agent-state.sh が書き込む

# ウィンドウ名の後ろに、そのウィンドウで最も急ぐエージェントの状態を付ける
set-option -g @claude_win_icon '#{?#{==:#{@claude_win_state},blocked}, ✋,#{?#{==:#{@claude_win_state},done}, ✅,#{?#{==:#{@claude_win_state},working}, ⏳,}}}'
set-option -g window-status-format '#I:#W#{?window_flags,#{window_flags}, }#{E:@claude_win_icon}'
set-option -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}, }#{E:@claude_win_icon}'

# 開いたペインの「未確認の完了」を消す
set-hook -g after-select-window 'run-shell -b "~/.tmux/bin/claude-agent-state.sh seen #{pane_id}"'
set-hook -g after-select-pane 'run-shell -b "~/.tmux/bin/claude-agent-state.sh seen #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.tmux/bin/claude-agent-state.sh seen #{pane_id}"'

# prefix + a: エージェント一覧 / prefix + s: セッション一覧 / prefix + j: 次の対応待ちへ移動
bind-key a display-popup -E -w 85% -h 80% "~/.tmux/bin/claude-agent-switch.sh agents"
bind-key s display-popup -E -w 70% -h 70% "~/.tmux/bin/claude-agent-switch.sh sessions"
bind-key j run-shell "~/.tmux/bin/claude-agent-switch.sh next '#{pane_id}'"

# ---- セッションの保存と復元 ----
# Claude Code の会話は tmux-claude-continuity が --resume で再開する（~/.zshrc の source と Claude Code の hook も必要）
# Codex は ~/.codex/hooks.json の hook が起動記録を codex resume に書き換え、同じ仕組みで再開する。
# @claude-continuity-restore-procs に codex を入れると、この記録より ps の素の codex が優先されるため入れない
set-option -g @resurrect-capture-pane-contents 'on'
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-claude-continuity/tmux-claude-continuity.tmux
# continuum は status-right に自動保存の処理を差し込むため、status-right を設定した後で読み込む
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
