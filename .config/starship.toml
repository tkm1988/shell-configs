"$schema" = 'https://starship.rs/config-schema.json'

# Nerd Font がない端末でも崩れないよう、記号は通常の文字に限定する
format = """
$username$hostname$directory$git_branch$git_state$git_status$aws$python$cmd_duration
$character"""

add_newline = true

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = ""
format = "on [$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "[=${count}](bold red)"
ahead = "[⇡${count}](bold green)"
behind = "[⇣${count}](bold red)"
diverged = "[⇡${ahead_count}⇣${behind_count}](bold red)"
untracked = "[?${count}](bold blue)"
stashed = "[\\$${count}](bold white)"
modified = "[!${count}](bold yellow)"
staged = "[+${count}](bold green)"
renamed = "[»${count}](bold green)"
deleted = "[✘${count}](bold red)"

# AWS_PROFILE を切り替えて作業するため、どの環境に向いているかを常に表示する
[aws]
symbol = "aws:"
format = '[$symbol$profile]($style) '
style = "bold #ff9900"

[python]
symbol = "py:"
format = '[$symbol$version(\($virtualenv\))]($style) '

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"
show_notifications = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
